name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
      prose: ${{ steps.filter.outputs.prose }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
            workflows:
              - '.github/workflows/**'
            prose:
              - '{**/*.md,.vale.ini,.vale/**,mise.toml}'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @recompose/desktop exec playwright install --with-deps chromium
      - run: pnpm run fmt:check
      - run: pnpm exec turbo run lint typecheck build test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      - run: pnpm --filter @recompose/desktop run storybook:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/desktop/coverage/lcov.info
            packages/contracts/coverage/lcov.info
          retention-days: 1
      - run: pnpm run lint:boundaries
      - run: pnpm run lint:fsd
      - run: pnpm run lint:dead
      - run: pnpm run lint:openspec
      - run: pnpm run lint:dup
      - run: pnpm run lint:spell

  mutation:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/contracts/reports/stryker-incremental.json
            apps/desktop/reports/stryker-incremental.json
          key: mutation-incremental-${{ github.sha }}
          restore-keys: mutation-incremental-
      - shell: bash
        run: |
          contracts=$(git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)packages/contracts/src/**/*.ts' | grep -vE '\.(test(-d)?|d)\.ts$' | sed 's|^packages/contracts/||' | paste -sd, -) || true
          desktop=$(git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)apps/desktop/src/main/**/*.ts' | grep -vE '\.(test|d)\.ts$' | sed 's|^apps/desktop/||' | paste -sd, -) || true
          if [ -z "$contracts" ] && [ -z "$desktop" ]; then
            echo "mutation scope untouched, skipping"
            exit 0
          fi
          contracts_excludes=$(jq -r '[.mutate[] | select(startswith("!"))] | join(",")' packages/contracts/stryker.config.json)
          desktop_excludes=$(jq -r '[.mutate[] | select(startswith("!"))] | join(",")' apps/desktop/stryker.config.json)
          if [ -n "$contracts" ]; then
            if [ -n "$contracts_excludes" ]; then
              contracts="$contracts,$contracts_excludes"
            fi
            pnpm --filter @recompose/contracts run test:mutation --incremental --mutate "$contracts"
          fi
          if [ -n "$desktop" ]; then
            if [ -n "$desktop_excludes" ]; then
              desktop="$desktop,$desktop_excludes"
            fi
            pnpm --filter @recompose/desktop run test:mutation --incremental --mutate "$desktop"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
        if: runner.os == 'Linux'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter @recompose/desktop exec node node_modules/electron/install.js
      - run: pnpm exec turbo run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring
      - if: runner.os == 'Linux'
        run: |
          cat > apps/desktop/keyring-probe.cjs <<'PROBE'
          const { _electron } = require('playwright');

          function inherited() {
            return Object.fromEntries(
              Object.entries(process.env).filter(([, value]) => value !== undefined),
            );
          }

          (async () => {
            const app = await _electron.launch({
              args: [process.cwd()],
              env: {
                ...inherited(),
                NODE_ENV: 'production',
                ELECTRON_RENDERER_URL: '',
                RECOMPOSE_USER_DATA_DIR: '/tmp/probe-userdata',
              },
            });
            const out = await app.evaluate(
              ({ safeStorage }) =>
                `backend=${safeStorage.getSelectedStorageBackend()} available=${safeStorage.isEncryptionAvailable()}`,
            );
            console.log(out);
            await app.close();
            if (!out.includes('available=true')) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          PROBE
          cat > /tmp/e2e-linux.sh <<'SCRIPT'
          set -e
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)"
          eval "$(printf '\n' | gnome-keyring-daemon --start --components=secrets)"
          export XDG_CURRENT_DESKTOP=GNOME
          export RECOMPOSE_PASSWORD_STORE=gnome-libsecret
          xvfb-run --auto-servernum pnpm --filter @recompose/desktop exec node keyring-probe.cjs
          xvfb-run --auto-servernum pnpm --filter @recompose/desktop run test:e2e
          xvfb-run --auto-servernum pnpm --filter @recompose/desktop run test:e2e:visual
          SCRIPT
          dbus-run-session -- bash /tmp/e2e-linux.sh
      - if: runner.os != 'Linux'
        run: pnpm --filter @recompose/desktop run test:e2e
      - if: runner.os != 'Linux'
        run: pnpm --filter @recompose/desktop run test:e2e:visual
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @recompose/desktop run test:e2e:leak
      - run: pnpm --filter @recompose/desktop exec electron-builder --dir
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @recompose/desktop run test:e2e:packaged
      - if: runner.os != 'Linux'
        run: pnpm --filter @recompose/desktop run test:e2e:packaged
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 3

  e2e-quarantine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter @recompose/desktop exec node node_modules/electron/install.js
      - run: pnpm exec turbo run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      - run: xvfb-run --auto-servernum pnpm --filter @recompose/desktop run test:e2e:quarantine
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-quarantine-traces
          path: apps/desktop/test-results
          retention-days: 3

  coverage-upload:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: apps/desktop/coverage/lcov.info,packages/contracts/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm run lint:spell
      - run: pnpm run lint:openspec
      - uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.15.2
          files: all
          reporter: local
          fail_on_error: true
          filter_mode: nofilter

  meta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .status+" "+.filename' > files.txt
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name] | join(" ")')
          body=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          pr_type=$(printf '%s' "$PR_TITLE" | sed -E 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/')
          src_changed=$(awk '{print $2}' files.txt | grep -E '^(apps|packages)/[^/]+/src/.*\.(ts|tsx)$' | grep -vE '\.(test|test-d)\.(ts|tsx)$' | head -1 || true)
          tests_changed=$(awk '{print $2}' files.txt | grep -E '\.(test|test-d|stories)\.(ts|tsx)$' | head -1 || true)
          new_ui_components=$(grep '^added ' files.txt | awk '{print $2}' | grep -E '^apps/desktop/src/renderer/src/.*/ui/[^/]+\.tsx$' | grep -vE '\.(test|stories)\.tsx$' || true)
          all_files=$(grep -v '^removed ' files.txt | awk '{print $2}')
          fail=0
          case "$pr_type" in
            feat|fix|perf)
              if [ -n "$src_changed" ] && [ -z "$tests_changed" ]; then
                if printf '%s' "$labels" | grep -qw 'tdd-exempt' && printf '%s' "$body" | grep -q 'TDD-exempt:'; then
                  echo "::notice::tdd-exempt accepted; the weekly exemption audit lists this PR"
                else
                  echo "::error::'$pr_type' changes src without a test diff. tdd-bdd.md ties behavior changes to test changes. Escape: add the tdd-exempt label plus a 'TDD-exempt: <reason>' line in the PR body."
                  fail=1
                fi
              fi ;;
          esac
          missing_stories=""
          for component in $new_ui_components; do
            sibling="${component%.tsx}.stories.tsx"
            if ! printf '%s\n' "$all_files" | grep -qxF "$sibling"; then
              missing_stories="$missing_stories $component"
            fi
          done
          if [ -n "$missing_stories" ]; then
            if printf '%s' "$labels" | grep -qw 'stories-exempt' && printf '%s' "$body" | grep -q 'Stories-exempt:'; then
              echo "::notice::stories-exempt accepted; the weekly exemption audit lists this PR"
            else
              echo "::error::new renderer ui component(s) landed without a sibling story:${missing_stories}. Every ui component ships a *.stories.tsx sibling. Escape: add the stories-exempt label plus a 'Stories-exempt: <reason>' line in the PR body."
              fail=1
            fi
          fi
          adr_trigger=$(awk '{print $2}' files.txt | grep -E '^(\.github/workflows/|turbo\.json$|tsconfig[^/]*\.json$|\.oxlintrc\.json$|lefthook\.yml$|\.dependency-cruiser\.cjs$|knip\.json$|codecov\.yml$|\.vale\.ini$|\.jscpd\.json$|mise\.toml$|pnpm-workspace\.yaml$|steiger\.config)' | head -1 || true)
          new_pkg=$(grep '^added ' files.txt | awk '{print $2}' | grep -E '^(apps|packages)/[^/]+/package\.json$' | head -1 || true)
          adr_changed=$(awk '{print $2}' files.txt | grep -E '^docs/adr/' | head -1 || true)
          if { [ -n "$adr_trigger" ] || [ -n "$new_pkg" ]; } && [ -z "$adr_changed" ]; then
            if printf '%s' "$labels" | grep -qw 'adr-exempt' && printf '%s' "$body" | grep -q 'ADR-exempt:'; then
              echo "::notice::adr-exempt accepted; the weekly exemption audit lists this PR"
            else
              echo "::error::architecture-significant paths changed (${adr_trigger:-$new_pkg}) without a docs/adr change. Record the decision, or add the adr-exempt label plus an 'ADR-exempt: <reason>' line in the PR body."
              fail=1
            fi
          fi
          exit "$fail"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          ./gitleaks git . --no-banner --redact --log-opts "$range"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm audit --prod --audit-level=high

  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.28.0 --min-severity medium .github/workflows/

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  commitlint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  ci-success:
    needs:
      [
        changes,
        check,
        e2e,
        mutation,
        coverage-upload,
        prose,
        meta,
        gitleaks,
        audit,
        zizmor,
        actionlint,
        commitlint-pr,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
